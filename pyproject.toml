[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oif-fabric"
version = "0.1.0"
description = "Open Intelligence resource contracts and offline validation tools."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Open Intelligence Fabric contributors" }]
dependencies = []

[project.scripts]
oif-validate = "oif_fabric.validate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
